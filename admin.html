<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del Profesor</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2.5c5.6 6.6 9.5 11.1 9.5 16A9.5 9.5 0 0 1 6.5 18.5c0-4.9 3.9-9.4 9.5-16Z' fill='%23ff9a2e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<!-- Ingreso del profesor -->
<section id="login" class="adm-login">
  <div class="card">
    <span data-logo></span>
    <h2>Panel del profesor</h2>
    <p class="muted" style="margin-top:6px">Diplomado en Petróleo y Gas · UCAB</p>
    <form id="f-login">
      <label class="field"><span>Clave de administrador</span>
        <input class="input" id="clave" type="password" required autocomplete="current-password"></label>
      <button type="submit" id="b-login" class="btn lg" style="width:100%;margin-top:20px">Entrar al panel</button>
      <div id="login-msg" class="msg err hide" role="alert"></div>
    </form>
  </div>
</section>

<!-- Aplicación -->
<div id="app" class="app hide">
  <aside class="side" id="side">
    <div class="brand"><span data-logo></span><div>Parcial UCAB<small>Petróleo y Gas</small></div></div>
    <div class="nav-label">General</div>
    <nav class="nav" id="nav">
      <a href="#resumen" data-v="resumen"><span data-ic="dashboard"></span>Panel de control</a>
      <a href="#estudiantes" data-v="estudiantes"><span data-ic="users"></span>Estudiantes<span class="count hide" id="nav-curso"></span></a>
      <a href="#analisis" data-v="analisis"><span data-ic="chart"></span>Análisis de resultados</a>
      <a href="#banco" data-v="banco"><span data-ic="book"></span>Banco de preguntas</a>
    </nav>
    <div class="nav-label">Configuración</div>
    <nav class="nav">
      <a href="#ajustes" data-v="ajustes"><span data-ic="settings"></span>Ajustes</a>
    </nav>
    <div class="foot nav">
      <a href="index.html" target="_blank" rel="noopener"><span data-ic="eye"></span>Ver página del estudiante</a>
      <button class="theme-btn" id="b-tema"></button>
      <button class="logout" id="b-salir"><span data-ic="logout"></span>Cerrar sesión</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn ghost icon menu-btn" id="b-menu" aria-label="Menú"><span data-ic="menu"></span></button>
      <div><h1 id="v-title"></h1><div class="sub" id="v-sub"></div></div>
      <div class="right">
        <span class="live" id="live">En vivo</span>
        <button class="btn secondary sm" id="b-refresh"><span data-ic="refresh"></span><span>Actualizar</span></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
